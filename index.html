<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My IPTV Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#0f0f14; color:#fff; min-height:100vh; padding:15px; padding-bottom:40px; }
  h1 { text-align:center; margin-bottom:15px; color:#4ade80; font-size:22px; }

  .pl-info {
    background:#1a1a22; padding:10px 12px; border-radius:10px;
    margin-bottom:12px; border:1px solid #2a2a33;
    font-size:12px; color:#888; text-align:center;
  }
  .pl-info b { color:#4ade80; }

  /* Search */
  .search-box { display:flex; gap:8px; margin-bottom:10px; }
  .search-box input {
    flex:1; padding:12px; border-radius:10px; border:1px solid #333;
    background:#1a1a22; color:#fff; font-size:15px; outline:none;
  }
  .search-box input:focus { border-color:#4ade80; }

  .status { text-align:center; color:#888; font-size:13px; margin-bottom:12px; }
  .status.ok { color:#4ade80; }
  .status.err { color:#f87171; }

  /* Player */
  .player-card {
    background:#1a1a22; border-radius:14px; padding:15px;
    margin-bottom:15px; display:none;
    border:1px solid #2a2a33;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .player-card.active { display:block; animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  video { width:100%; border-radius:10px; background:#000; max-height:420px; }

  /* Info Box */
  .info-box {
    background:#0f0f14;
    border:1px solid #2a2a33;
    border-radius:12px;
    padding:14px;
    margin-top:14px;
  }
  .info-box h4 {
    font-size:13px; color:#4ade80; margin-bottom:10px;
    text-transform:uppercase; letter-spacing:1px;
    display:flex; align-items:center; gap:6px;
  }
  .info-row {
    display:flex; align-items:center; gap:10px;
    padding:8px 0;
    border-bottom:1px solid #1a1a22;
  }
  .info-row:last-child { border-bottom:none; }
  .info-label {
    width:90px; font-size:11px; color:#888;
    text-transform:uppercase; letter-spacing:0.5px;
    flex-shrink:0;
  }
  .info-value {
    flex:1; font-size:13px; color:#e5e5e5;
    word-break:break-all;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .info-value.link-text {
    color:#4ade80;
    cursor:pointer;
    text-decoration:underline dotted;
    transition:0.2s;
  }
  .info-value.link-text:hover { color:#6ee7a3; }
  .info-value.link-text:active { transform:scale(0.98); }

  .info-logo {
    width:42px; height:42px; border-radius:8px;
    object-fit:cover; background:#333;
    border:1px solid #2a2a33;
  }

  /* Copy button */
  .copy-btn {
    padding:8px 14px; border-radius:8px; border:none;
    background:#4ade80; color:#000; font-weight:bold;
    cursor:pointer; font-size:12px;
    white-space:nowrap;
    transition:0.2s;
  }
  .copy-btn:hover { background:#6ee7a3; }
  .copy-btn:active { transform:scale(0.94); }
  .copy-btn.copied { background:#22c55e; color:#fff; }

  /* Grid */
  .playlist-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
  }
  .playlist-item {
    background:#1a1a22; border-radius:10px; padding:10px;
    cursor:pointer; text-align:center; transition:0.2s;
    border:1px solid transparent;
    position:relative;
  }
  .playlist-item:hover { border-color:#4ade80; transform:translateY(-2px); }
  .playlist-item img { width:100%; height:80px; object-fit:cover; border-radius:8px; background:#333; }
  .playlist-item p { font-size:13px; margin-top:6px; font-weight:bold;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .playlist-item span { font-size:11px; color:#888; }
  .playlist-item .pl-source {
    display:inline-block; margin-top:4px; padding:2px 6px;
    background:#0f0f14; border-radius:4px; font-size:9px; color:#4ade80;
  }
  .no-result { text-align:center; color:#888; padding:20px; }

  /* Toast */
  .toast {
    position:fixed; bottom:25px; left:50%; transform:translateX(-50%) translateY(80px);
    background:#22c55e; color:#fff; padding:12px 22px;
    border-radius:30px; font-weight:bold; font-size:14px;
    box-shadow:0 8px 24px rgba(34,197,94,0.4);
    transition:0.3s; z-index:999; opacity:0; pointer-events:none;
  }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<h1>🎬 My IPTV Player</h1>

<div class="pl-info" id="plInfo">⏳ Loading playlists.txt...</div>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Search channel or category...">
</div>

<div class="status" id="status">Please wait...</div>

<!-- Player -->
<div class="player-card" id="playerCard">
  <video id="video" controls autoplay playsinline></video>

  <!-- Info Box -->
  <div class="info-box">
    <h4>📺 Channel Info</h4>

    <div class="info-row">
      <span class="info-label">Name</span>
      <span class="info-value" id="iName">-</span>
    </div>

    <div class="info-row">
      <span class="info-label">Category</span>
      <span class="info-value" id="iCat">-</span>
    </div>

    <div class="info-row">
      <span class="info-label">Logo</span>
      <img class="info-logo" id="iLogoImg" src="" alt="">
      <span class="info-value link-text" id="iLogo" onclick="copyText(this.textContent, this)">-</span>
    </div>

    <div class="info-row">
      <span class="info-label">Stream</span>
      <span class="info-value link-text" id="iStream" onclick="copyText(this.textContent, this)">-</span>
      <button class="copy-btn" onclick="copyText(document.getElementById('iStream').textContent, this)">📋 Copy</button>
    </div>
  </div>
</div>

<div class="playlist-grid" id="grid"></div>
<div class="no-result" id="noResult" style="display:none;">❌ No result found</div>

<div class="toast" id="toast">✅ Copied!</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// ============================================================
const LINKS_FILE = 'playlists.txt';
// ============================================================

let playlists = [];
let playlist = [];
let hls = null;

// ---------- Init ----------
fetch(LINKS_FILE + '?v=' + Date.now())
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(text => {
    const urls = text.split('\n')
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#'));

    if (!urls.length) throw new Error('No links in playlists.txt');

    document.getElementById('plInfo').innerHTML =
      `📂 <b>${urls.length}</b> playlist link(s) found`;

    urls.forEach(url => loadPlaylist(url));
  })
  .catch(e => {
    document.getElementById('plInfo').innerHTML = `❌ ${e.message}`;
    setStatus('Failed to load playlists.txt', 'err');
  });

// ---------- Load playlist ----------
function loadPlaylist(url) {
  const rawUrl = toRaw(url);
  const name = decodeURIComponent(rawUrl.split('/').pop() || 'playlist');

  const entry = { url, name, channels: [], loading: true };
  playlists.push(entry);

  fetch(rawUrl)
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(text => {
      const channels = parseM3U(text);
      const idx = playlists.findIndex(p => p === entry);
      playlists[idx] = { url, name, channels, loading: false };
      rebuildMerged();
      renderGrid(playlist);
      setStatus(`✅ ${playlist.length} channels from ${playlists.filter(p=>!p.loading).length} playlist(s)`, 'ok');
    })
    .catch(e => {
      playlists = playlists.filter(p => p !== entry);
      console.warn('Failed:', url, e.message);
      setStatus(`⚠️ Some playlist(s) failed — ${playlist.length} channels loaded`, 'err');
    });
}

function toRaw(url) {
  if (url.includes('github.com') && url.includes('/blob/')) {
    return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
  }
  return url;
}

function rebuildMerged() {
  playlist = [];
  playlists.forEach(pl => {
    if (pl.loading) return;
    pl.channels.forEach(ch => {
      playlist.push({ ...ch, source: pl.name });
    });
  });
}

// ---------- Parse M3U ----------
function parseM3U(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  const items = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith('#EXTINF')) {
      const info = lines[i];
      const name = info.split(',').pop().trim();
      const logoMatch = info.match(/tvg-logo="([^"]*)"/);
      const catMatch = info.match(/group-title="([^"]*)"/);
      const url = lines[i + 1] || '';
      if (url && !url.startsWith('#')) {
        items.push({
          name,
          logo: logoMatch ? logoMatch[1] : '',
          category: catMatch ? catMatch[1] : 'General',
          url
        });
        i++;
      }
    }
  }
  return items;
}

// ---------- Render grid ----------
function renderGrid(items) {
  const grid = document.getElementById('grid');
  const noResult = document.getElementById('noResult');
  if (!items.length) {
    grid.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';
  grid.innerHTML = items.map(item => {
    const idx = playlist.indexOf(item);
    return `
      <div class="playlist-item" onclick="playItem(${idx})">
        <img src="${item.logo || 'https://via.placeholder.com/150x80/1a1a22/4ade80?text=TV'}"
             onerror="this.src='https://via.placeholder.com/150x80/1a1a22/4ade80?text=TV'">
        <p title="${item.name}">${item.name}</p>
        <span>${item.category}</span>
        ${item.source ? `<div class="pl-source">📂 ${item.source}</div>` : ''}
      </div>
    `;
  }).join('');
}

// ---------- Search ----------
function searchPlaylist() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  if (!q) { renderGrid(playlist); return; }
  const filtered = playlist.filter(i =>
    i.name.toLowerCase().includes(q) ||
    i.category.toLowerCase().includes(q)
  );
  renderGrid(filtered);
}
document.getElementById('search').addEventListener('input', searchPlaylist);

// ---------- Play ----------
function playItem(index) {
  const item = playlist[index];
  if (!item) return;

  const card = document.getElementById('playerCard');
  card.classList.add('active');

  // Info box
  document.getElementById('iName').textContent = item.name;
  document.getElementById('iCat').textContent = item.category + (item.source ? ' • ' + item.source : '');

  const logoUrl = item.logo || 'https://via.placeholder.com/60/1a1a22/4ade80?text=TV';
  document.getElementById('iLogoImg').src = logoUrl;
  document.getElementById('iLogo').textContent = item.logo || '(no logo)';
  document.getElementById('iStream').textContent = item.url;

  // Video
  const video = document.getElementById('video');
  if (hls) { hls.destroy(); hls = null; }

  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = item.url;
  } else if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(item.url);
    hls.attachMedia(video);
  } else {
    video.src = item.url;
  }

  video.play().catch(() => {});
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- Copy (text + button both) ----------
function copyText(text, el) {
  if (!text || text === '-' || text === '(no logo)') {
    showToast('❌ Nothing to copy');
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ Copied!');
    if (el && el.classList.contains('copy-btn')) {
      const orig = el.textContent;
      el.textContent = '✅ Done';
      el.classList.add('copied');
      setTimeout(() => {
        el.textContent = orig;
        el.classList.remove('copied');
      }, 1500);
    }
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ Copied!');
  });
}

// ---------- Toast ----------
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- Status ----------
function setStatus(msg, cls = '') {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status ' + cls;
}
</script>

</body>
</html>
